name: Maintenance task
description: Track documentation, dependency or other repository maintenance.
title: "[Maintenance]: "
body:
  - type: markdown
    attributes:
      value: |
        Follow [CONTRIBUTING.md](https://github.com/Zns-Nexus/aggregate-mail/blob/main/CONTRIBUTING.md)
        for ownership and scope. Use the private path in
        [SECURITY.md](https://github.com/Zns-Nexus/aggregate-mail/blob/main/SECURITY.md)
        for vulnerabilities.
  - type: textarea
    id: task
    attributes:
      label: Task and reason
      description: What should change, and why?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and owner
      description: List owned paths, task owner, base branch and feature branch.
    validations:
      required: true
  - type: textarea
    id: related-work
    attributes:
      label: Related issues or pull requests
      description: Link relevant open or closed work, or state that you searched by problem and affected area.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks and proof
      description: Name the required checks and how results will be tied to the changed revision.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed credentials, mail data, personal details, private hostnames, machine paths and session records.
          required: true
