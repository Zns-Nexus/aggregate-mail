name: Bug report
description: Something in Emc² does not work as documented.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Emc² handles real mail, so remove mail content,
        addresses, account names and local paths from anything you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Emc² version
      description: Settings → About, or the name of the installer you ran.
      placeholder: "0.1.4"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Mail provider
      description: Which account was involved, if the problem is account-specific.
      options:
        - Not account-specific
        - Gmail
        - iCloud Mail
        - Fastmail
        - Yahoo Mail
        - IMAP
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redacted output, a screenshot, or nothing.
    validations:
      required: false
  - type: textarea
    id: related-work
    attributes:
      label: Related issues or pull requests
      description: Link relevant open or closed work, or state that you searched by problem and affected area.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed mail content, addresses, account names and local paths from this report.
          required: true
        - label: This is not a security vulnerability. I will report those privately instead.
          required: true
